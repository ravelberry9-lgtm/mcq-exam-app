<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Unit 1 core geography diagrams</title>
  <desc id="desc">Four labelled educational diagrams: latitude and longitude, seasons, Earth interior and rock cycle.</desc>
  <style>
    .panel{fill:#fffdf7;stroke:#385170;stroke-width:2}.h{font:700 22px sans-serif;fill:#17324d}.t{font:16px sans-serif;fill:#17324d}.small{font:14px sans-serif;fill:#17324d}.line{stroke:#385170;stroke-width:2;fill:none}.grid{stroke:#5e91b7;stroke-width:1.5;fill:none}.sun{fill:#f6c945;stroke:#bd8620;stroke-width:2}.earth{fill:#91c6eb;stroke:#385170;stroke-width:2}.land{fill:#79b56b}.warm{stroke:#e17c38;stroke-width:4;marker-end:url(#arrow)}.arrow{stroke:#385170;stroke-width:2;marker-end:url(#arrow)}.layer{stroke:#fff;stroke-width:1.5}.rock{fill:#bc9a72;stroke:#66472d;stroke-width:2}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#385170"/></marker></defs>

  <rect class="panel" x="20" y="20" width="560" height="440" rx="12"/>
  <text class="h" x="45" y="55">1. Latitude &amp; Longitude / అక్షాంశాలు–రేఖాంశాలు</text>
  <circle class="earth" cx="300" cy="250" r="145"/>
  <path class="land" d="M228 155c38-30 85-26 100 2l-25 31 45 34-26 46-64-10-42-55z"/>
  <ellipse class="grid" cx="300" cy="250" rx="145" ry="34"/>
  <ellipse class="grid" cx="300" cy="250" rx="122" ry="95"/>
  <ellipse class="grid" cx="300" cy="250" rx="70" ry="138"/>
  <path class="grid" d="M155 250h290M300 105v290M190 155c70 35 150 35 220 0M190 345c70-35 150-35 220 0"/>
  <path d="M155 250h290" stroke="#d14b4b" stroke-width="3"/>
  <path d="M300 105v290" stroke="#8a5bb7" stroke-width="3"/>
  <text class="t" x="60" y="245">Equator / భూమధ్యరేఖ (0°)</text><path class="line" d="M225 240L157 250"/>
  <text class="t" x="335" y="95">North Pole / ఉత్తర ధ్రువం</text>
  <text class="t" x="330" y="420">South Pole / దక్షిణ ధ్రువం</text>
  <text class="t" x="370" y="280">Longitude / రేఖాంశం</text>
  <text class="t" x="65" y="340">Latitude / అక్షాంశం</text>
  <text class="small" x="45" y="430">Latitude tells north–south position; longitude tells east–west position.</text>

  <rect class="panel" x="620" y="20" width="560" height="440" rx="12"/>
  <text class="h" x="645" y="55">2. Seasons / ఋతువులు ఎందుకు మారతాయి?</text>
  <circle class="sun" cx="900" cy="240" r="58"/><text class="t" x="875" y="245">Sun</text>
  <ellipse class="line" cx="900" cy="245" rx="210" ry="125" stroke-dasharray="6 5"/>
  <g transform="translate(690 245)"><circle class="earth" r="38"/><path d="M-15 -52L15 52" stroke="#d14b4b" stroke-width="3"/><text class="small" x="-65" y="80">June: North tilts</text><text class="small" x="-65" y="98">toward Sun</text></g>
  <g transform="translate(1110 245)"><circle class="earth" r="38"/><path d="M-15 -52L15 52" stroke="#d14b4b" stroke-width="3"/><text class="small" x="-76" y="80">December: North tilts</text><text class="small" x="-76" y="98">away from Sun</text></g>
  <g transform="translate(900 120)"><circle class="earth" r="32"/><path d="M-13 -45L13 45" stroke="#d14b4b" stroke-width="3"/><text class="small" x="-58" y="-52">March equinox</text></g>
  <g transform="translate(900 370)"><circle class="earth" r="32"/><path d="M-13 -45L13 45" stroke="#d14b4b" stroke-width="3"/><text class="small" x="-67" y="68">September equinox</text></g>
  <text class="small" x="648" y="430">Axis tilt + revolution, not distance from the Sun, cause the seasons.</text>

  <rect class="panel" x="20" y="500" width="560" height="450" rx="12"/>
  <text class="h" x="45" y="535">3. Earth Interior / భూమి లోపలి పొరలు</text>
  <circle cx="300" cy="735" r="170" fill="#d9945a" class="layer"/>
  <circle cx="300" cy="735" r="145" fill="#de6e52" class="layer"/>
  <circle cx="300" cy="735" r="78" fill="#e1b23f" class="layer"/>
  <circle cx="300" cy="735" r="38" fill="#f4e6a2" class="layer"/>
  <path d="M300 565A170 170 0 0 1 470 735L300 735z" fill="#6a9bc1" opacity=".92"/>
  <text class="t" x="55" y="620">Crust / భూపటలం</text><path class="line" d="M180 620L225 650"/>
  <text class="t" x="55" y="675">Mantle / మధ్య పొర</text><path class="line" d="M180 675L205 700"/>
  <text class="t" x="360" y="785">Outer core / ద్రవ కేంద్ర భాగం</text><path class="line" d="M355 775L330 755"/>
  <text class="t" x="360" y="830">Inner core / ఘన కేంద్ర భాగం</text><path class="line" d="M355 820L325 770"/>
  <text class="small" x="45" y="925">S-waves do not pass through the liquid outer core.</text>

  <rect class="panel" x="620" y="500" width="560" height="450" rx="12"/>
  <text class="h" x="645" y="535">4. Rock Cycle / శిలా చక్రం</text>
  <rect class="rock" x="830" y="575" width="130" height="54" rx="15"/><text class="t" x="850" y="608">Magma / ద్రవ శిలా పదార్థం</text>
  <rect class="rock" x="1010" y="690" width="120" height="54" rx="15"/><text class="t" x="1022" y="723">Igneous</text>
  <rect class="rock" x="830" y="825" width="130" height="54" rx="15"/><text class="t" x="848" y="858">Metamorphic</text>
  <rect class="rock" x="650" y="690" width="125" height="54" rx="15"/><text class="t" x="662" y="723">Sedimentary</text>
  <path class="arrow" d="M960 603C1030 610 1060 650 1060 685"/><text class="small" x="970" y="640">cooling</text>
  <path class="arrow" d="M1010 744C980 800 945 820 960 825"/><text class="small" x="965" y="785">heat + pressure</text>
  <path class="arrow" d="M830 852C760 835 710 790 710 748"/><text class="small" x="680" y="805">weathering, deposition</text>
  <path class="arrow" d="M775 695C810 650 830 635 850 630"/><text class="small" x="725" y="665">melting</text>
  <text class="small" x="648" y="925">Rocks change form over time; they are not fixed forever.</text>
</svg>
