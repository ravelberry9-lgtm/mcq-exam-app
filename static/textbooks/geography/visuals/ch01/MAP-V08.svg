<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">The measurement changes the answer</title><desc id="desc">Everest, Mauna Kea, Chimborazo పోలికల్లో కొలతకు తీసుకున్న ఆధారం వేరు. చిత్రాల్లో పర్వతాల ఆకారాలు, ఎత్తులు నిజ నిష్పత్తిలో లేవు.</desc><rect width="900" height="440" rx="18" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="30" y="46" font-size="28" fill="#173e35" text-anchor="start">The measurement changes the answer</text><rect x="30" y="100" width="260" height="245" rx="12" fill="#e4f0e8" stroke="#b5cec0"/><text x="160" y="145" font-size="25" fill="#173e35" text-anchor="middle">Everest</text><path d="M65 265 L160 175 L255 265Z" fill="#c6d9d1" stroke="#3e7865" stroke-width="3"/><text x="160" y="315" font-size="20" fill="#173e35" text-anchor="middle">Above sea level</text><rect x="320" y="100" width="260" height="245" rx="12" fill="#e4f0e8" stroke="#b5cec0"/><text x="450" y="145" font-size="25" fill="#173e35" text-anchor="middle">Mauna Kea</text><path d="M355 265 L450 175 L545 265Z" fill="#c6d9d1" stroke="#3e7865" stroke-width="3"/><text x="450" y="315" font-size="20" fill="#173e35" text-anchor="middle">Base to summit</text><rect x="610" y="100" width="260" height="245" rx="12" fill="#e4f0e8" stroke="#b5cec0"/><text x="740" y="145" font-size="25" fill="#173e35" text-anchor="middle">Chimborazo</text><path d="M645 265 L740 175 L835 265Z" fill="#c6d9d1" stroke="#3e7865" stroke-width="3"/><text x="740" y="315" font-size="20" fill="#173e35" text-anchor="middle">From Earth’s centre</text><text x="40" y="405" font-size="20" fill="#173e35" text-anchor="start">Different reference measurements; drawings are not scaled height comparisons.</text></g></svg>