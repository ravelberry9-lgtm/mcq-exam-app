<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Earth models: do not mix the surfaces</title><desc id="desc">Sphere, Ellipsoid, Geoid వేర్వేరు నమూనాలు. తేడాలు స్పష్టంగా కనిపించేందుకు చిత్రంలో పెంచి చూపాం. Geoid పర్వతాల అసలు ఉపరితలం కాదు.</desc><rect width="900" height="440" rx="18" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="30" y="46" font-size="28" fill="#173e35" text-anchor="start">Earth models: do not mix the surfaces</text><text x="150" y="100" font-size="23" fill="#173e35" text-anchor="middle">Sphere</text><text x="450" y="100" font-size="23" fill="#173e35" text-anchor="middle">Ellipsoid</text><text x="750" y="100" font-size="23" fill="#173e35" text-anchor="middle">Geoid reference</text><circle cx="150" cy="220" r="85" fill="#d9eaf4" stroke="#36758c" stroke-width="3"/><ellipse cx="450" cy="220" rx="110" ry="78" fill="#d9eaf4" stroke="#36758c" stroke-width="3"/><path d="M650,220 C645,165 700,130 755,145 C805,128 857,180 845,225 C860,275 800,310 750,297 C700,312 640,270 650,220Z" fill="#e1eee0" stroke="#42774c" stroke-width="3"/><text x="150" y="350" font-size="20" fill="#173e35" text-anchor="middle">Equal radii</text><text x="450" y="350" font-size="19" fill="#173e35" text-anchor="middle">Equator bulge; polar flattening</text><text x="750" y="350" font-size="19" fill="#173e35" text-anchor="middle">Gravity-defined level surface</text><text x="450" y="400" font-size="20" fill="#173e35" text-anchor="middle">Shape differences are exaggerated. Geoid is NOT the terrain.</text></g></svg>