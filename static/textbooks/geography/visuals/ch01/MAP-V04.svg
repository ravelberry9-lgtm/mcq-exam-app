<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Large scale and small scale</title><desc id="desc">పెద్ద RF విలువ ఉన్న పటం తక్కువ ప్రాంతాన్ని ఎక్కువ వివరాలతో చూపుతుంది. ఇవి నిజమైన ప్రాంతాల పటాలు కావు; స్కేలు భావాన్ని పోల్చే నమూనా చిత్రాలు.</desc><rect width="900" height="440" rx="18" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="30" y="46" font-size="28" fill="#173e35" text-anchor="start">Large scale and small scale</text><rect x="40" y="90" width="390" height="260" rx="12" fill="#e4f0e8" stroke="#b5cec0"/><text x="60" y="130" font-size="26" fill="#173e35" text-anchor="start">1 : 25,000</text><text x="60" y="325" font-size="20" fill="#173e35" text-anchor="start">Large scale: more local detail</text><rect x="470" y="90" width="390" height="260" rx="12" fill="#e4f0e8" stroke="#b5cec0"/><text x="490" y="130" font-size="26" fill="#173e35" text-anchor="start">1 : 5,000,000</text><text x="490" y="325" font-size="20" fill="#173e35" text-anchor="start">Small scale: wider area</text><line x1="60" y1="180" x2="410" y2="180" stroke="#9bafa0" stroke-width="2"/><line x1="60" y1="220" x2="410" y2="220" stroke="#9bafa0" stroke-width="2"/><line x1="60" y1="260" x2="410" y2="260" stroke="#9bafa0" stroke-width="2"/><line x1="110" y1="155" x2="110" y2="280" stroke="#9bafa0" stroke-width="2"/><line x1="190" y1="155" x2="190" y2="280" stroke="#9bafa0" stroke-width="2"/><line x1="270" y1="155" x2="270" y2="280" stroke="#9bafa0" stroke-width="2"/><line x1="350" y1="155" x2="350" y2="280" stroke="#9bafa0" stroke-width="2"/><rect x="120" y="170" width="40" height="25" rx="12" fill="#edd5ab" stroke="#b5cec0"/><rect x="210" y="210" width="40" height="25" rx="12" fill="#edd5ab" stroke="#b5cec0"/><rect x="300" y="250" width="40" height="25" rx="12" fill="#edd5ab" stroke="#b5cec0"/><path d="M500 200 Q560 140 620 210 T820 240" fill="none" stroke="#347fa4" stroke-width="5"/><text x="40" y="405" font-size="20" fill="#173e35" text-anchor="start">Illustrative panels, not real geographic maps; compare the RF denominators.</text></g></svg>