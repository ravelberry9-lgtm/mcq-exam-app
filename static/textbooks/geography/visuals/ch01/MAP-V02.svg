<svg aria-labelledby="title desc" height="480" role="img" viewBox="0 0 900 480" width="900" xmlns="http://www.w3.org/2000/svg"><title id="title">Eight directions</title><desc id="desc">ఈ చిత్రంలో ఉత్తరం పైవైపు చూపాం. ఇతర పటాల్లో North arrow వేరే దిశలో ఉండవచ్చు. దిశ బాణాన్ని బట్టి మిగతా దిక్కులు నిర్ణయించాలి.</desc><rect fill="#fbfdfb" height="480" rx="18" width="900"/><g font-family="Arial, sans-serif"><text fill="#173e35" font-size="28" text-anchor="start" x="30" y="46">Eight directions</text><line stroke="#275f4c" stroke-width="3" x1="450" x2="450.0" y1="235" y2="110.0"/><text fill="#173e35" font-size="27" text-anchor="middle" x="450.0" y="79.0">N</text><line stroke="#275f4c" stroke-width="3" x1="450" x2="538.3883476483185" y1="235" y2="146.61165235168156"/><text fill="#173e35" font-size="27" text-anchor="middle" x="567.3797256769669" y="127.6202743230331">NE</text><line stroke="#275f4c" stroke-width="3" x1="450" x2="575.0" y1="235" y2="235.0"/><text fill="#173e35" font-size="27" text-anchor="middle" x="616.0" y="245.0">E</text><line stroke="#275f4c" stroke-width="3" x1="450" x2="538.3883476483185" y1="235" y2="323.3883476483185"/><text fill="#173e35" font-size="27" text-anchor="middle" x="567.3797256769669" y="362.3797256769669">SE</text><line stroke="#275f4c" stroke-width="3" x1="450" x2="450.0" y1="235" y2="360.0"/><text fill="#173e35" font-size="27" text-anchor="middle" x="450.0" y="411.0">S</text><line stroke="#275f4c" stroke-width="3" x1="450" x2="361.6116523516816" y1="235" y2="323.3883476483185"/><text fill="#173e35" font-size="27" text-anchor="middle" x="332.62027432303313" y="362.3797256769669">SW</text><line stroke="#275f4c" stroke-width="3" x1="450" x2="325.0" y1="235" y2="235.00000000000003"/><text fill="#173e35" font-size="27" text-anchor="middle" x="284.0" y="245.00000000000003">W</text><line stroke="#275f4c" stroke-width="3" x1="450" x2="361.6116523516815" y1="235" y2="146.61165235168158"/><text fill="#173e35" font-size="27" text-anchor="middle" x="332.6202743230331" y="127.62027432303312">NW</text><circle cx="450" cy="235" fill="#d49b3c" r="7"/><text fill="#173e35" font-size="21" text-anchor="start" x="40" y="455">Use the supplied north arrow; the page top is not always north.</text></g></svg>