<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">GIS: combine information layers</title><desc id="desc">ఎత్తులు, వరద విస్తృతి, వాడగల రహదారులు, ఆశ్రయాల స్థానాలు వేర్వేరు సమాచార పొరలు. ఇది పద్ధతిని వివరించే నమూనా; ఏ నిజమైన ప్రాంతానికి మార్గ సూచన కాదు.</desc><rect width="900" height="460" rx="18" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="30" y="46" font-size="28" fill="#173e35" text-anchor="start">GIS: combine information layers</text><rect x="95" y="95" width="620" height="60" rx="12" fill="#e7d2af" stroke="#b5cec0"/><text x="120" y="134" font-size="24" fill="#173e35" text-anchor="start">Elevation</text><text x="750" y="135" font-size="30" fill="#173e35" text-anchor="middle">+</text><rect x="95" y="170" width="620" height="60" rx="12" fill="#cfe4f0" stroke="#b5cec0"/><text x="120" y="209" font-size="24" fill="#173e35" text-anchor="start">Flood extent</text><text x="750" y="210" font-size="30" fill="#173e35" text-anchor="middle">+</text><rect x="95" y="245" width="620" height="60" rx="12" fill="#e2eadf" stroke="#b5cec0"/><text x="120" y="284" font-size="24" fill="#173e35" text-anchor="start">Usable roads</text><text x="750" y="285" font-size="30" fill="#173e35" text-anchor="middle">+</text><rect x="95" y="320" width="620" height="60" rx="12" fill="#f0dba9" stroke="#b5cec0"/><text x="120" y="359" font-size="24" fill="#173e35" text-anchor="start">Shelter locations</text><text x="750" y="360" font-size="30" fill="#173e35" text-anchor="middle">+</text><text x="40" y="425" font-size="20" fill="#173e35" text-anchor="start">GIS combines referenced layers; a position alone is not a safe-route assessment.</text></g></svg>