<svg aria-labelledby="title desc" height="440" role="img" viewBox="0 0 900 440" width="900" xmlns="http://www.w3.org/2000/svg"><title id="title">Reading contour spacing</title><desc id="desc">రెండు భాగాల్లో Scale, Contour interval ఒకటే. రేఖల విలువలు ఎత్తులు. ఒకే ఎత్తు పెరుగుదల తక్కువ అడ్డ దూరంలో జరిగితే వాలు ఎక్కువ. ఇవి ఒక సమాన వాలున్న కొండ భాగానికి నమూనా రేఖలు.</desc><rect fill="#fbfdfb" height="440" rx="18" width="900"/><g font-family="Arial, sans-serif"><text fill="#173e35" font-size="28" text-anchor="start" x="30" y="46">Reading contour spacing</text><text fill="#173e35" font-size="25" text-anchor="start" x="60" y="100">Panel A</text><text fill="#173e35" font-size="25" text-anchor="start" x="470" y="100">Panel B</text><text fill="#173e35" font-size="22" text-anchor="middle" x="450" y="142">Same horizontal scale; contour interval = 20 m</text><line stroke="#a47c42" stroke-width="4" x1="110" x2="110" y1="185" y2="330"/><text fill="#173e35" font-size="18" text-anchor="middle" x="110" y="365">100 m</text><line stroke="#a47c42" stroke-width="4" x1="145" x2="145" y1="185" y2="330"/><text fill="#173e35" font-size="18" text-anchor="middle" x="145" y="390">120 m</text><line stroke="#a47c42" stroke-width="4" x1="180" x2="180" y1="185" y2="330"/><text fill="#173e35" font-size="18" text-anchor="middle" x="180" y="365">140 m</text><line stroke="#a47c42" stroke-width="4" x1="215" x2="215" y1="185" y2="330"/><text fill="#173e35" font-size="18" text-anchor="middle" x="215" y="390">160 m</text><line stroke="#a47c42" stroke-width="4" x1="490" x2="490" y1="185" y2="330"/><text fill="#173e35" font-size="18" text-anchor="middle" x="490" y="365">100 m</text><line stroke="#a47c42" stroke-width="4" x1="580" x2="580" y1="185" y2="330"/><text fill="#173e35" font-size="18" text-anchor="middle" x="580" y="365">120 m</text><line stroke="#a47c42" stroke-width="4" x1="670" x2="670" y1="185" y2="330"/><text fill="#173e35" font-size="18" text-anchor="middle" x="670" y="365">140 m</text><line stroke="#a47c42" stroke-width="4" x1="760" x2="760" y1="185" y2="330"/><text fill="#173e35" font-size="18" text-anchor="middle" x="760" y="365">160 m</text><text fill="#173e35" font-size="21" text-anchor="start" x="60" y="415">Compare equal vertical rise over different horizontal distances.</text></g></svg>