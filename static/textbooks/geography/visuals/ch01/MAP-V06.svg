<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">The legend controls the meaning</title><desc id="desc">ఒకే ఆకుపచ్చ రంగుకు ఈ రెండు ఉదాహరణ పటాల్లో వేర్వేరు అర్థాలు ఇచ్చాం. ఇవి బోధనా సూచికలు మాత్రమే. పుస్తకపు రంగుల పట్టికనూ అన్ని పటాలకు వర్తింపజేయకూడదు.</desc><rect width="900" height="440" rx="18" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="30" y="46" font-size="28" fill="#173e35" text-anchor="start">The legend controls the meaning</text><rect x="40" y="95" width="390" height="250" rx="12" fill="#e4f0e8" stroke="#b5cec0"/><text x="60" y="140" font-size="26" fill="#173e35" text-anchor="start">Map A legend</text><rect x="70" y="185" width="70" height="70" fill="#599a54" stroke="#244e37"/><text x="60" y="305" font-size="22" fill="#173e35" text-anchor="start">Green = forest</text><rect x="470" y="95" width="390" height="250" rx="12" fill="#e4f0e8" stroke="#b5cec0"/><text x="490" y="140" font-size="26" fill="#173e35" text-anchor="start">Map B legend</text><rect x="500" y="185" width="70" height="70" fill="#599a54" stroke="#244e37"/><text x="490" y="305" font-size="22" fill="#173e35" text-anchor="start">Green = cultivated land</text><text x="40" y="400" font-size="21" fill="#173e35" text-anchor="start">Same colour, different meanings: read each map’s own legend.</text></g></svg>