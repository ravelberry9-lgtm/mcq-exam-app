<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Scale: keep the units consistent</title><desc id="desc">RF లెక్కలో ఇచ్చిన 6 cmను ఉపయోగించాలి; తెరపై గీతను కొలవకండి. పటంతోపాటు Graphic scale ఒకే నిష్పత్తిలో పరిమాణం మారితే ఉపయోగపడుతుంది.</desc><rect width="900" height="440" rx="18" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="30" y="46" font-size="28" fill="#173e35" text-anchor="start">Scale: keep the units consistent</text><rect x="40" y="85" width="820" height="120" rx="12" fill="#e4f0e8" stroke="#b5cec0"/><text x="65" y="125" font-size="27" fill="#173e35" text-anchor="start">Given RF = 1 : 50,000</text><text x="65" y="169" font-size="25" fill="#173e35" text-anchor="start">Given map distance = 6 cm  →  ground distance = 3 km</text><text x="45" y="245" font-size="24" fill="#173e35" text-anchor="start">Graphic scale (a teaching example)</text><rect x="80" y="285" width="165" height="28" fill="#1e654b" stroke="#1e654b"/><rect x="245" y="285" width="165" height="28" fill="#fff" stroke="#1e654b"/><rect x="410" y="285" width="165" height="28" fill="#1e654b" stroke="#1e654b"/><rect x="575" y="285" width="165" height="28" fill="#fff" stroke="#1e654b"/><text x="80" y="349" font-size="21" fill="#173e35" text-anchor="middle">0</text><text x="245" y="349" font-size="21" fill="#173e35" text-anchor="middle">0.5</text><text x="410" y="349" font-size="21" fill="#173e35" text-anchor="middle">1</text><text x="575" y="349" font-size="21" fill="#173e35" text-anchor="middle">1.5</text><text x="740" y="349" font-size="21" fill="#173e35" text-anchor="middle">2</text><text x="790" y="349" font-size="21" fill="#173e35" text-anchor="start">km</text><text x="45" y="401" font-size="20" fill="#173e35" text-anchor="start">The screen image is not a physical centimetre ruler.</text></g></svg>