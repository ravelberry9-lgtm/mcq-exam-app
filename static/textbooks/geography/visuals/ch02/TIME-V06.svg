<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Tilt and opposite hemispheric seasons</title><desc id="desc">రెండు వేర్వేరు కాలాల చిత్రాలు ఇవి; ఒకే కక్ష్య చిత్రం కాదు. జూన్‌లో ఉత్తర భాగం, డిసెంబర్‌లో దక్షిణ భాగం ఎక్కువగా సూర్యకాంతి వైపు ఉంటాయి. రెండు భూఅక్షాలు సమాంతరంగా ఉన్నాయి.</desc><rect width="1000" height="520" rx="18" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173e35" text-anchor="start">Tilt and opposite hemispheric seasons</text><text x="260" y="100" font-size="25" fill="#173e35" text-anchor="middle">JUNE</text><circle cx="260" cy="250" r="100" fill="#667b8b"/><path d="M260,150 A100,100 0 0 1 260,350 Z" fill="#f2d98b"/><line x1="203" y1="380" x2="317" y2="120" stroke="#255d47" stroke-width="5"/><text x="324" y="126" font-size="22" fill="#173e35" text-anchor="start">N</text><text x="188" y="404" font-size="22" fill="#173e35" text-anchor="start">S</text><text x="260" y="442" font-size="23" fill="#173e35" text-anchor="middle">Northern summer</text><text x="740" y="100" font-size="25" fill="#173e35" text-anchor="middle">DECEMBER</text><circle cx="740" cy="250" r="100" fill="#667b8b"/><path d="M740,150 A100,100 0 0 0 740,350 Z" fill="#f2d98b"/><line x1="683" y1="380" x2="797" y2="120" stroke="#255d47" stroke-width="5"/><text x="804" y="126" font-size="22" fill="#173e35" text-anchor="start">N</text><text x="668" y="404" font-size="22" fill="#173e35" text-anchor="start">S</text><text x="740" y="442" font-size="23" fill="#173e35" text-anchor="middle">Northern winter</text><text x="500" y="200" font-size="22" fill="#173e35" text-anchor="middle">SUNLIGHT</text><line x1="485" y1="230" x2="382" y2="230" stroke="#bd903c" stroke-width="3"/><path d="M382,230 l-12,-6 l0,12 z" fill="#bd903c" transform="rotate(180.0 382 230)"/><line x1="515" y1="230" x2="618" y2="230" stroke="#bd903c" stroke-width="3"/><path d="M618,230 l-12,-6 l0,12 z" fill="#bd903c" transform="rotate(0.0 618 230)"/><line x1="485" y1="270" x2="382" y2="270" stroke="#bd903c" stroke-width="3"/><path d="M382,270 l-12,-6 l0,12 z" fill="#bd903c" transform="rotate(180.0 382 270)"/><line x1="515" y1="270" x2="618" y2="270" stroke="#bd903c" stroke-width="3"/><path d="M618,270 l-12,-6 l0,12 z" fill="#bd903c" transform="rotate(0.0 618 270)"/><line x1="485" y1="310" x2="382" y2="310" stroke="#bd903c" stroke-width="3"/><path d="M382,310 l-12,-6 l0,12 z" fill="#bd903c" transform="rotate(180.0 382 310)"/><line x1="515" y1="310" x2="618" y2="310" stroke="#bd903c" stroke-width="3"/><path d="M618,310 l-12,-6 l0,12 z" fill="#bd903c" transform="rotate(0.0 618 310)"/><text x="40" y="490" font-size="20" fill="#173e35" text-anchor="start">Two separate snapshots; axes stay parallel. Orbit and distances are not drawn.</text></g></svg>