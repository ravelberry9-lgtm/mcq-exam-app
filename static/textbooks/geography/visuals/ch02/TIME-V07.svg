<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Four annual events: keep the hemisphere</title><desc id="desc">మార్చి, సెప్టెంబర్ విషువత్తుల్లో Declination సున్నా. జూన్, డిసెంబర్ అయనాంతాల్లో ఉత్తర–దక్షిణ గరిష్ఠాలు వస్తాయి. ఋతు పేరుకు అర్ధగోళం తప్పనిసరిగా చెప్పాలి.</desc><rect width="1000" height="500" rx="18" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173e35" text-anchor="start">Four annual events: keep the hemisphere</text><rect x="50" y="95" width="900" height="340" rx="12" fill="#edf5ef" stroke="#b7d0bf"/><text x="75" y="135" font-size="21" fill="#173e35" text-anchor="start">EVENT</text><text x="430" y="135" font-size="21" fill="#173e35" text-anchor="start">DECLINATION</text><text x="680" y="135" font-size="21" fill="#173e35" text-anchor="start">HEMISPHERES</text><text x="75" y="195" font-size="23" fill="#173e35" text-anchor="start">March equinox</text><text x="430" y="195" font-size="23" fill="#173e35" text-anchor="start">0°</text><text x="680" y="195" font-size="21" fill="#173e35" text-anchor="start">N spring / S autumn</text><text x="75" y="260" font-size="23" fill="#173e35" text-anchor="start">June solstice</text><text x="430" y="260" font-size="23" fill="#173e35" text-anchor="start">about +23.44°</text><text x="680" y="260" font-size="21" fill="#173e35" text-anchor="start">N summer / S winter</text><text x="75" y="325" font-size="23" fill="#173e35" text-anchor="start">September equinox</text><text x="430" y="325" font-size="23" fill="#173e35" text-anchor="start">0°</text><text x="680" y="325" font-size="21" fill="#173e35" text-anchor="start">N autumn / S spring</text><text x="75" y="390" font-size="23" fill="#173e35" text-anchor="start">December solstice</text><text x="430" y="390" font-size="23" fill="#173e35" text-anchor="start">about −23.44°</text><text x="680" y="390" font-size="21" fill="#173e35" text-anchor="start">N winter / S summer</text><text x="50" y="480" font-size="20" fill="#173e35" text-anchor="start">Dates vary by year and local time; N = Northern, S = Southern Hemisphere.</text></g></svg>