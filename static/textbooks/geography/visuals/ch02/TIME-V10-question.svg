<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Gregorian calendar: classify the year</title><desc id="desc">Years 2000, 2100 and 2024 are shown for comparison. Apply the Gregorian calendar rule requested in the question.</desc><rect width="1000" height="500" rx="18" fill="#fbfdfb"/><g font-family="Arial, sans-serif" fill="#173e35"><text x="50" y="65" font-size="30">Gregorian calendar: classify the year</text><rect x="70" y="130" width="860" height="220" rx="12" fill="#edf5ef" stroke="#b7d0bf"/><text x="230" y="220" text-anchor="middle" font-size="42">2000</text><text x="500" y="220" text-anchor="middle" font-size="42">2100</text><text x="770" y="220" text-anchor="middle" font-size="42">2024</text><text x="230" y="300" text-anchor="middle" font-size="30">?</text><text x="500" y="300" text-anchor="middle" font-size="30">?</text><text x="770" y="300" text-anchor="middle" font-size="30">?</text><text x="70" y="430" font-size="24">Use the year and condition given in the question.</text></g></svg>