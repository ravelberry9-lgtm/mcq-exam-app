<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180" role="img" aria-labelledby="title desc"><title id="title">Why Equator zero and Greenwich zero are different</title><desc id="desc">ముందుగా రెండు సున్నాల తేడాను అర్థం చేసుకునే చిత్రం. Equator భూఅక్షంతో సంబంధం ఉన్న జ్యామితీయ ఆధారం. Longitude సున్నాకు ఒక Meridianను ఉమ్మడిగా ఎంచుకోవాలి. ప్రాచీన Coordinates వినియోగం, Airy పరికరం, 1884 ఎంపిక మూడు వేర్వేరు విషయాలు.</desc><rect width="1400" height="1180" fill="#f6f8f3"/><rect x="0" y="0" width="1400" height="205" rx="0" fill="#173d4b"/><text x="65" y="57" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#aadacc" text-anchor="start">CHAPTER 02 / START WITH THE REFERENCES</text><text x="65" y="131" font-family="Arial, sans-serif" font-size="57" font-weight="700" fill="#ffffff" text-anchor="start">WHERE DOES ZERO COME FROM?</text><text x="65" y="177" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#d2e7df" text-anchor="start">Imaginary lines locate places. The two zeros have different reasons.</text><rect x="65" y="245" width="620" height="425" rx="18" fill="#e8f1e9"/><rect x="715" y="245" width="620" height="425" rx="18" fill="#e7eff4"/><text x="95" y="300" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#276f59" text-anchor="start">0° LATITUDE: EQUATOR</text><text x="745" y="300" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2d6b88" text-anchor="start">0° LONGITUDE: PRIME MERIDIAN</text><circle cx="245" cy="470" r="115" fill="#81bac6" stroke="#447d88" stroke-width="2"/><line x1="245" y1="330" x2="245" y2="610" stroke="#477568" stroke-width="3" stroke-dasharray="7 6"/><line x1="115" y1="470" x2="375" y2="470" stroke="#f4ce7c" stroke-width="7"/><text x="245" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#276f59" text-anchor="middle">N</text><text x="245" y="633" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#276f59" text-anchor="middle">S</text><text x="400" y="384" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#276f59" text-anchor="start">Earth axis +</text><text x="400" y="423" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#276f59" text-anchor="start">equatorial plane</text><text x="400" y="484" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#173e4b" text-anchor="start">A geometric reference</text><text x="400" y="520" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#173e4b" text-anchor="start">for north / south.</text><text x="400" y="583" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#657d72" text-anchor="start">Not a painted line.</text><circle cx="905" cy="470" r="115" fill="#b7d5e1" stroke="#6e97a9" stroke-width="2"/><ellipse cx="905" cy="470" rx="45" ry="115" fill="none" stroke="#7ea6b7" stroke-width="2"/><ellipse cx="905" cy="470" rx="85" ry="115" fill="none" stroke="#7ea6b7" stroke-width="2"/><path d="M905,355 A45,115 0 0 1 905,585" fill="none" stroke="#c08b3e" stroke-width="7"/><line x1="790" y1="470" x2="1020" y2="470" stroke="#8bb0c0" stroke-width="2"/><text x="1070" y="384" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#2d6b88" text-anchor="start">One selected</text><text x="1070" y="423" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#2d6b88" text-anchor="start">meridian = 0°</text><text x="1070" y="484" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#173e4b" text-anchor="start">Greenwich, London</text><text x="1070" y="520" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#173e4b" text-anchor="start">A common choice</text><text x="1070" y="558" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#173e4b" text-anchor="start">for east / west.</text><text x="745" y="636" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#617a85" text-anchor="start">Other meridians are geometrically equally valid choices.</text><rect x="65" y="715" width="1270" height="320" rx="18" fill="#173d4b"/><text x="95" y="762" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#abdacd" text-anchor="start">DEVELOPMENT IS DIFFERENT FROM STANDARDISATION</text><text x="100" y="826" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#f2d08b" text-anchor="start">2nd century</text><text x="100" y="870" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">PTOLEMY</text><text x="100" y="916" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#d1e4dd" text-anchor="start">An example of early</text><text x="100" y="950" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#d1e4dd" text-anchor="start">coordinate use.</text><text x="100" y="984" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#d1e4dd" text-anchor="start">Not Greenwich zero.</text><text x="510" y="826" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#f2d08b" text-anchor="start">1851</text><text x="510" y="870" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">AIRY INSTRUMENT</text><text x="510" y="916" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#d1e4dd" text-anchor="start">Historic Observatory</text><text x="510" y="950" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#d1e4dd" text-anchor="start">reference instrument.</text><text x="510" y="984" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#d1e4dd" text-anchor="start">Not the invention of longitude.</text><text x="940" y="826" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#f2d08b" text-anchor="start">1884</text><text x="940" y="870" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">WASHINGTON CONFERENCE</text><text x="940" y="916" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#d1e4dd" text-anchor="start">Greenwich recommended</text><text x="940" y="950" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#d1e4dd" text-anchor="start">as the common zero.</text><text x="940" y="984" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#d1e4dd" text-anchor="start">Existing charts favoured it.</text><text x="70" y="1090" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#245c68" text-anchor="start">The 1884 conference chose a shared zero; it did not invent latitude and longitude.</text><text x="70" y="1141" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#61776f" text-anchor="start">Original schematics • Sources: Royal Museums Greenwich, Library of Congress and NOAA</text></svg>