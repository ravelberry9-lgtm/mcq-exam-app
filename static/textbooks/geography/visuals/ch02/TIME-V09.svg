<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Two definitions of a day</title><desc id="desc">నక్షత్రాల ఆధారంగా ఒక చుట్టు పూర్తయినా సూర్యుడి దిశ తిరిగి రావడానికి కొద్దిగా అదనంగా తిరగాలి. అందుకే సౌరదినం దాదాపు నాలుగు నిమిషాలు ఎక్కువ.</desc><rect width="1000" height="500" rx="18" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173e35" text-anchor="start">Two definitions of a day</text><rect x="50" y="100" width="420" height="250" rx="12" fill="#edf5ef" stroke="#b7d0bf"/><rect x="530" y="100" width="420" height="250" rx="12" fill="#f4efe3" stroke="#b7d0bf"/><text x="260" y="150" font-size="25" fill="#173e35" text-anchor="middle">SIDEREAL DAY</text><text x="260" y="205" font-size="23" fill="#173e35" text-anchor="middle">Distant-star reference</text><text x="260" y="270" font-size="29" fill="#173e35" text-anchor="middle">23 h 56 min 4 s</text><text x="740" y="150" font-size="25" fill="#173e35" text-anchor="middle">MEAN SOLAR DAY</text><text x="740" y="205" font-size="23" fill="#173e35" text-anchor="middle">Mean-Sun reference</text><text x="740" y="270" font-size="29" fill="#173e35" text-anchor="middle">24 h</text><text x="500" y="405" font-size="23" fill="#173e35" text-anchor="middle">Earth also advances in orbit → extra turning to face the Sun.</text><text x="500" y="460" font-size="21" fill="#173e35" text-anchor="middle">Difference ≈ 3 min 56 s; do not confuse a day with a year.</text></g></svg>