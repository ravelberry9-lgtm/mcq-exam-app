<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Two definitions of a day</title><desc id="desc">Two rounded day lengths are displayed for comparison: sidereal day 23 hours 56 minutes 4 seconds, and mean solar day 24 hours.</desc><rect width="1000" height="500" rx="18" fill="#fbfdfb" /><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173e35" text-anchor="start">Two definitions of a day</text><rect x="50" y="100" width="420" height="250" rx="12" fill="#edf5ef" stroke="#b7d0bf" /><rect x="530" y="100" width="420" height="250" rx="12" fill="#f4efe3" stroke="#b7d0bf" /><text x="260" y="150" font-size="25" fill="#173e35" text-anchor="middle">SIDEREAL DAY</text><text x="260" y="270" font-size="29" fill="#173e35" text-anchor="middle">23 h 56 min 4 s</text><text x="740" y="150" font-size="25" fill="#173e35" text-anchor="middle">MEAN SOLAR DAY</text><text x="740" y="270" font-size="29" fill="#173e35" text-anchor="middle">24 h</text></g></svg>