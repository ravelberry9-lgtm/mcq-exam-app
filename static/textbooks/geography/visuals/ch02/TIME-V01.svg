<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Reading a coordinate pair</title><desc id="desc">40°N, 30°W బిందువు ఉత్తర, పశ్చిమ అర్ధగోళాల్లో ఉంది. ఇది స్థాన సూచనల నమూనా మాత్రమే; గీతల దూరాలను భూదూరాలుగా కొలవకండి.</desc><rect width="1000" height="500" rx="18" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173e35" text-anchor="start">Reading a coordinate pair</text><rect x="90" y="90" width="600" height="320" rx="12" fill="#edf5ef" stroke="#b7d0bf"/><line x1="150" y1="90" x2="150" y2="410" stroke="#aec6b7" stroke-width="2"/><text x="150" y="445" font-size="20" fill="#173e35" text-anchor="middle">60°W</text><line x1="270" y1="90" x2="270" y2="410" stroke="#aec6b7" stroke-width="2"/><text x="270" y="445" font-size="20" fill="#173e35" text-anchor="middle">30°W</text><line x1="390" y1="90" x2="390" y2="410" stroke="#aec6b7" stroke-width="2"/><text x="390" y="445" font-size="20" fill="#173e35" text-anchor="middle">0°</text><line x1="510" y1="90" x2="510" y2="410" stroke="#aec6b7" stroke-width="2"/><text x="510" y="445" font-size="20" fill="#173e35" text-anchor="middle">30°E</text><line x1="630" y1="90" x2="630" y2="410" stroke="#aec6b7" stroke-width="2"/><text x="630" y="445" font-size="20" fill="#173e35" text-anchor="middle">60°E</text><line x1="90" y1="410" x2="690" y2="410" stroke="#aec6b7" stroke-width="2"/><text x="72" y="417" font-size="20" fill="#173e35" text-anchor="end">40°S</text><line x1="90" y1="330" x2="690" y2="330" stroke="#aec6b7" stroke-width="2"/><text x="72" y="337" font-size="20" fill="#173e35" text-anchor="end">20°S</text><line x1="90" y1="250" x2="690" y2="250" stroke="#aec6b7" stroke-width="2"/><text x="72" y="257" font-size="20" fill="#173e35" text-anchor="end">0°</text><line x1="90" y1="170" x2="690" y2="170" stroke="#aec6b7" stroke-width="2"/><text x="72" y="177" font-size="20" fill="#173e35" text-anchor="end">20°N</text><line x1="90" y1="90" x2="690" y2="90" stroke="#aec6b7" stroke-width="2"/><text x="72" y="97" font-size="20" fill="#173e35" text-anchor="end">40°N</text><line x1="390" y1="90" x2="390" y2="410" stroke="#bd7b2d" stroke-width="4"/><line x1="90" y1="250" x2="690" y2="250" stroke="#3079a4" stroke-width="4"/><circle cx="270" cy="90" r="9" fill="#b94841"/><text x="725" y="130" font-size="24" fill="#173e35" text-anchor="start">Point P:</text><text x="725" y="169" font-size="24" fill="#173e35" text-anchor="start">40°N, 30°W</text><text x="725" y="220" font-size="22" fill="#173e35" text-anchor="start">North + West</text><text x="725" y="270" font-size="20" fill="#173e35" text-anchor="start">Latitude first;</text><text x="725" y="300" font-size="20" fill="#173e35" text-anchor="start">longitude second.</text><text x="80" y="485" font-size="20" fill="#173e35" text-anchor="start">Coordinate grid only; spacing is not a ground-distance scale.</text></g></svg>