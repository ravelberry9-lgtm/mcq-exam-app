<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Local mean time: show the working</title><desc id="desc">తూర్పువైపు ఉన్న ప్రదేశం స్థానిక సగటు కాలం ముందుంటుంది. 192 నిమిషాలు అంటే 3 గంటల 12 నిమిషాలు. నగరాల అధికారిక గడియార కాలం వేరుగా ఉండవచ్చు.</desc><rect width="1000" height="500" rx="18" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173e35" text-anchor="start">Local mean time: show the working</text><rect x="50" y="100" width="900" height="140" rx="12" fill="#edf5ef" stroke="#b7d0bf"/><text x="75" y="145" font-size="26" fill="#173e35" text-anchor="start">Reference: 30°E, local mean time 14:00</text><text x="75" y="193" font-size="26" fill="#173e35" text-anchor="start">Target: 78°E → 48° farther east</text><line x1="110" y1="280" x2="890" y2="280" stroke="#326852" stroke-width="3"/><path d="M890,280 l-12,-6 l0,12 z" fill="#326852" transform="rotate(0.0 890 280)"/><text x="500" y="267" font-size="24" fill="#173e35" text-anchor="middle">EAST → add local mean time</text><rect x="50" y="325" width="900" height="115" rx="12" fill="#edf5ef" stroke="#b7d0bf"/><text x="75" y="370" font-size="25" fill="#173e35" text-anchor="start">48° × 4 min/° = 192 min = 3 h 12 min</text><text x="75" y="413" font-size="25" fill="#173e35" text-anchor="start">14:00 + 3:12 = 17:12 local mean time</text><text x="50" y="480" font-size="20" fill="#173e35" text-anchor="start">These are solar-time calculations, not a claim about city clock zones.</text></g></svg>