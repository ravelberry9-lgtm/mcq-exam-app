<?xml version="1.0" encoding="utf-8"?>
<svg aria-labelledby="title desc" height="500" role="img" viewBox="0 0 1000 500" width="1000" xmlns="http://www.w3.org/2000/svg"><title id="title">Date Line: direction and calendar date</title><desc id="desc">ఒకే క్షణంలో చూపిన ±12 గంటల ఆదర్శ ఉదాహరణ ఇది. తూర్పుగా తేదీ రేఖ దాటితే ఒక రోజు తీసివేయాలి; పడమరకు దాటితే ఒక రోజు కలపాలి. అన్ని దీవుల వాస్తవ కాలమండలాలు ఇవేనని కాదు.</desc><rect fill="#fbfdfb" height="500" rx="18" width="1000"/><g font-family="Arial, sans-serif"><text fill="#173e35" font-size="28" text-anchor="start" x="30" y="45">Date Line: direction and calendar date</text><rect fill="#edf5ef" height="180" rx="12" stroke="#b7d0bf" width="390" x="50" y="105"/><rect fill="#f5efe5" height="180" rx="12" stroke="#b7d0bf" width="390" x="560" y="105"/><text fill="#173e35" font-size="25" text-anchor="middle" x="245" y="148">WEST side of the line</text><text fill="#173e35" font-size="24" text-anchor="middle" x="245" y="195">Idealised UTC +12</text><text fill="#173e35" font-size="27" text-anchor="middle" x="245" y="247">Tuesday 08:00</text><text fill="#173e35" font-size="25" text-anchor="middle" x="755" y="148">EAST side of the line</text><text fill="#173e35" font-size="24" text-anchor="middle" x="755" y="195">Idealised UTC −12</text><text fill="#173e35" font-size="27" text-anchor="middle" x="755" y="247">Monday 08:00</text><line stroke="#b8753d" stroke-dasharray="9 7" stroke-width="5" x1="500" x2="500" y1="85" y2="445"/><line stroke="#326852" stroke-width="3" x1="130" x2="870" y1="340" y2="340"/><path d="M870,340 l-12,-6 l0,12 z" fill="#326852" transform="rotate(0.0 870 340)"/><rect fill="#fbfdfb" height="34" width="640" x="180" y="297"/><text fill="#173e35" font-size="23" text-anchor="middle" x="500" y="325">Eastward crossing: subtract one date</text><line stroke="#326852" stroke-width="3" x1="870" x2="130" y1="405" y2="405"/><path d="M130,405 l-12,-6 l0,12 z" fill="#326852" transform="rotate(180.0 130 405)"/><rect fill="#fbfdfb" height="34" width="640" x="180" y="362"/><text fill="#173e35" font-size="23" text-anchor="middle" x="500" y="390">Westward crossing: add one date</text><text fill="#173e35" font-size="20" text-anchor="start" x="50" y="480">Same instant; illustrative ±12-hour zones. Actual Date Line bends.</text></g></svg>