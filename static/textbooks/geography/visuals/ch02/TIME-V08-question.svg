<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Solar altitude and the overhead direction</title><desc id="desc">Schematic horizon, vertical overhead direction and a ray toward the Sun. Use the latitude and declination in the question; the sketch is not to scale.</desc><rect width="1000" height="500" rx="18" fill="#fbfdfb" /><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173e35" text-anchor="start">Solar altitude and the overhead direction</text><line x1="100" y1="380" x2="590" y2="380" stroke="#647c6b" stroke-width="4" /><line x1="160" y1="380" x2="160" y2="105" stroke="#647c6b" stroke-width="3" stroke-dasharray="8 6" /><line x1="160" y1="380" x2="255.76564013118727" y2="116.88606617994566" stroke="#c58c35" stroke-width="3" /><path d="M255.76564013118727,116.88606617994566 l-12,-6 l0,12 z" fill="#c58c35" transform="rotate(-70.0 255.76564013118727 116.88606617994566)" /><text x="160" y="90" font-size="23" fill="#173e35" text-anchor="middle">Zenith</text><text x="405" y="420" font-size="23" fill="#173e35" text-anchor="start">Horizon: 0°</text><text x="250" y="330" font-size="27" fill="#173e35" text-anchor="start">Altitude?</text><text x="60" y="480" font-size="20" fill="#173e35" text-anchor="start">Not to scale. Use the latitude and declination given in the question.</text><path d="M260,380 A100,100 0 0 0 194.20201433256688,286.0307379214092" fill="none" stroke="#bd8c3c" stroke-width="3" /></g></svg>