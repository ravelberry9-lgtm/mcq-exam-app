<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Axial tilt: name the reference line</title><desc id="desc">అక్ష వంపు 23.44° కక్ష్య లంబంతో చేసిన కోణం. కక్ష్య సమతలంతో చేసిన కోణం 66.56°. ఏ రేఖను ఆధారంగా తీసుకున్నామో చూడాలి.</desc><rect width="1000" height="500" rx="18" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173e35" text-anchor="start">Axial tilt: name the reference line</text><line x1="110" y1="380" x2="900" y2="380" stroke="#737c77" stroke-width="4"/><line x1="410" y1="410" x2="410" y2="100" stroke="#818e86" stroke-width="3" stroke-dasharray="7 6"/><line x1="385.1779971383679" y1="437.2505735686301" x2="513.425011923467" y2="141.45594346404116" stroke="#327aa2" stroke-width="6"/><text x="410" y="88" font-size="23" fill="#173e35" text-anchor="middle">Orbital normal</text><text x="620" y="370" font-size="24" fill="#173e35" text-anchor="start">Orbital plane</text><text x="555" y="170" font-size="24" fill="#173e35" text-anchor="start">Earth axis</text><text x="255" y="245" font-size="25" fill="#173e35" text-anchor="start">23.44°</text><text x="545" y="333" font-size="25" fill="#173e35" text-anchor="start">66.56°</text><text x="75" y="470" font-size="23" fill="#173e35" text-anchor="start">Angles share the same vertex: 23.44° + 66.56° = 90°.</text><path d="M410,250 A130,130 0 0 1 461.7125059617335,260.7279717320206" fill="none" stroke="#b97531" stroke-width="3"/></g></svg>