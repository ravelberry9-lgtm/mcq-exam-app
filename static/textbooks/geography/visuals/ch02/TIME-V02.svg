<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Longitude spacing shrinks toward the poles</title><desc id="desc">ఒకే 1° Longitude కోణానికి భూమధ్యరేఖ వద్ద ఎక్కువ నేల దూరం ఉంటుంది. 60° అక్షాంశం వద్ద గోళ సుమారు లెక్కలో సగం. ఈ గీతలు పోలిక కోసం మాత్రమే.</desc><rect width="1000" height="500" rx="18" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173e35" text-anchor="start">Longitude spacing shrinks toward the poles</text><text x="70" y="140" font-size="24" fill="#173e35" text-anchor="start">0° latitude</text><line x1="300" y1="130" x2="900" y2="130" stroke="#357a9c" stroke-width="5"/><line x1="300" y1="117" x2="300" y2="143" stroke="#326852" stroke-width="3"/><line x1="900" y1="117" x2="900" y2="143" stroke="#326852" stroke-width="3"/><text x="600.0" y="182" font-size="23" fill="#173e35" text-anchor="middle">about 111 km</text><text x="70" y="280" font-size="24" fill="#173e35" text-anchor="start">60° latitude</text><line x1="300" y1="270" x2="600" y2="270" stroke="#357a9c" stroke-width="5"/><line x1="300" y1="257" x2="300" y2="283" stroke="#326852" stroke-width="3"/><line x1="600" y1="257" x2="600" y2="283" stroke="#326852" stroke-width="3"/><text x="450.0" y="322" font-size="23" fill="#173e35" text-anchor="middle">about 55.5 km</text><rect x="60" y="360" width="880" height="95" rx="12" fill="#edf5ef" stroke="#b7d0bf"/><text x="85" y="399" font-size="25" fill="#173e35" text-anchor="start">1° longitude ≈ 111 × cos(latitude) km</text><text x="85" y="436" font-size="21" fill="#173e35" text-anchor="start">At 60°: cos 60° = 0.5 → about half the equatorial spacing.</text></g></svg>