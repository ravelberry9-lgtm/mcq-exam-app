<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc"><title id="title">Longitude angle in an equatorial-plane polar view</title><desc id="desc">ఉత్తర ధ్రువం పైనుంచి చూసిన భావచిత్రం. Equator సమతలంలో సున్నా Meridian దిశ నుంచి పడమరగా 30° కొలిస్తే 30°W Longitude. ఇక్కడి రేఖలు Meridian దిశలను చూపుతాయి; అసలు దేశ సరిహద్దులు కావు.</desc><rect width="1100" height="600" fill="#f6f8f3"/><text x="35" y="48" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#173e4b" text-anchor="start">Longitude: measure from the chosen zero</text><rect x="555" y="105" width="505" height="420" rx="18" fill="#edf5ef"/><circle cx="270" cy="320" r="180" fill="#e4eef3" stroke="#7ba8b7" stroke-width="2"/><line x1="270" y1="320" x2="270" y2="500" stroke="#c28a3b" stroke-width="5"/><text x="286" y="539" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#9b6b2f" text-anchor="start">Prime direction: 0°</text><line x1="270" y1="320" x2="180.0" y2="475.88457268119896" stroke="#327f94" stroke-width="5"/><circle cx="270" cy="320" r="5" fill="#173e4b"/><text x="285" y="312" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173e4b" text-anchor="start">O</text><path d="M270,405 A85,85 0 0 1 227.5,393.61215932167727" fill="none" stroke="#327f94" stroke-width="3"/><text x="110" y="402" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#327f94" text-anchor="start">30°W</text><text x="60" y="512" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#327f94" text-anchor="start">P&#x27;s meridian direction</text><text x="270" y="111" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#173e4b" text-anchor="middle">View from above the North Pole</text><text x="580" y="150" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#173e4b" text-anchor="start">1  Use the equatorial plane.</text><text x="580" y="205" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#173e4b" text-anchor="start">2  Begin at the zero-meridian ray.</text><text x="580" y="260" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#173e4b" text-anchor="start">3  Turn 30° toward the west.</text><text x="580" y="330" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#327f94" text-anchor="start">Longitude = 30°W</text><text x="580" y="392" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#173e4b" text-anchor="start">This angle does not give latitude.</text><text x="580" y="450" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#173e4b" text-anchor="start">One meridian is not a time-zone strip.</text><text x="35" y="591" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#687d78" text-anchor="start">Polar teaching view: rays show meridian directions; no land boundaries or distance scale.</text></svg>