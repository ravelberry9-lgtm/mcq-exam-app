<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1870" viewBox="0 0 1400 1870" role="img" aria-labelledby="title desc"><title id="title">Earth, Time and Seasons — Chapter 02 visual revision</title><desc id="desc">Six linked revision panels: coordinates, local mean time, axial tilt, seasons, Date Line and solar altitude. Rounded values; original schematics.</desc><defs><linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122f43"/><stop offset="1" stop-color="#24545b"/></linearGradient><radialGradient id="earth"><stop stop-color="#7ed6d8"/><stop offset="1" stop-color="#2e7aa2"/></radialGradient></defs><rect width="1400" height="1870" fill="#f1f4ef"/><rect x="0" y="0" width="1400" height="405" rx="0" fill="#153b4a" stroke="none"/><text x="65" y="60" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#a8dbca" text-anchor="start">APPSC  /  WORLD GEOGRAPHY  /  CHAPTER 02</text><text x="65" y="150" font-family="Arial, sans-serif" font-size="76" font-weight="700" fill="#ffffff" text-anchor="start">EARTH, TIME</text><text x="65" y="235" font-family="Arial, sans-serif" font-size="76" font-weight="700" fill="#ffffff" text-anchor="start">&amp; SEASONS</text><text x="70" y="286" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#d5ebe4" text-anchor="start">Understand the relationships. Then solve the questions.</text><circle cx="1140" cy="180" r="130" fill="#2e82a5" stroke="#a3dcd7" stroke-width="2"/><ellipse cx="1140" cy="180" rx="125" ry="35" fill="none" stroke="#a9e0dc" opacity="0.45"/><ellipse cx="1140" cy="180" rx="125" ry="75" fill="none" stroke="#a9e0dc" opacity="0.45"/><ellipse cx="1140" cy="180" rx="125" ry="110" fill="none" stroke="#a9e0dc" opacity="0.45"/><ellipse cx="1140" cy="180" rx="38" ry="126" fill="none" stroke="#a9e0dc" opacity="0.45"/><ellipse cx="1140" cy="180" rx="85" ry="126" fill="none" stroke="#a9e0dc" opacity="0.45"/><line x1="1067" y1="345" x2="1213" y2="15" stroke="#f3cc75" stroke-width="5"/><text x="1240" y="45" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#f3cc75" text-anchor="start">N</text><text x="1140" y="390" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#c3e3db" text-anchor="middle">SCHEMATIC GLOBE</text><rect x="65" y="328" width="325" height="44" rx="13" fill="#e3eee8" stroke="none"/><text x="227.5" y="357" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#184d53" text-anchor="middle">Longitude: 1° → 4 min</text><rect x="415" y="328" width="325" height="44" rx="13" fill="#e3eee8" stroke="none"/><text x="577.5" y="357" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#184d53" text-anchor="middle">IST = UTC + 05:30</text><rect x="765" y="328" width="325" height="44" rx="13" fill="#e3eee8" stroke="none"/><text x="927.5" y="357" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#184d53" text-anchor="middle">Axial tilt ≈ 23.44°</text><rect x="65" y="452" width="620" height="340" rx="22" fill="#dfe6e4" stroke="none"/><rect x="65" y="445" width="620" height="340" rx="22" fill="#ffffff" stroke="none"/><rect x="89" y="467" width="48" height="36" rx="12" fill="#257783" stroke="none"/><text x="113" y="492" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">01</text><text x="155" y="493" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#257783" text-anchor="start">FIND YOUR PLACE</text><line x1="135.0" y1="543" x2="135.0" y2="703" stroke="#c9dcd6" stroke-width="2"/><line x1="186.0" y1="543" x2="186.0" y2="703" stroke="#c9dcd6" stroke-width="2"/><line x1="237.0" y1="543" x2="237.0" y2="703" stroke="#c9dcd6" stroke-width="2"/><line x1="288.0" y1="543" x2="288.0" y2="703" stroke="#c9dcd6" stroke-width="2"/><line x1="339.0" y1="543" x2="339.0" y2="703" stroke="#c9dcd6" stroke-width="2"/><line x1="135" y1="703" x2="339" y2="703" stroke="#c9dcd6" stroke-width="2"/><line x1="135" y1="663" x2="339" y2="663" stroke="#c9dcd6" stroke-width="2"/><line x1="135" y1="623" x2="339" y2="623" stroke="#c9dcd6" stroke-width="2"/><line x1="135" y1="583" x2="339" y2="583" stroke="#c9dcd6" stroke-width="2"/><line x1="135" y1="543" x2="339" y2="543" stroke="#c9dcd6" stroke-width="2"/><line x1="237" y1="543" x2="237" y2="703" stroke="#d0983f" stroke-width="3"/><line x1="135" y1="623" x2="339" y2="623" stroke="#2f8497" stroke-width="3"/><circle cx="186" cy="543" r="7" fill="#d56455"/><text x="185" y="527" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#b54a43" text-anchor="start">P</text><text x="385" y="561" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#173d4b" text-anchor="start">40°N, 30°W</text><text x="385" y="604" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#173d4b" text-anchor="start">Northern + Western</text><text x="385" y="646" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#173d4b" text-anchor="start">Latitude → N / S</text><text x="385" y="684" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#173d4b" text-anchor="start">Longitude → E / W</text><text x="121" y="556" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#66877e" text-anchor="end">40°N</text><text x="186" y="722" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#66877e" text-anchor="middle">30°W</text><rect x="91" y="727" width="568" height="44" rx="13" fill="#e8f1ee" stroke="none"/><text x="375.0" y="756" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1c645c" text-anchor="middle">Angles locate a place; they are not km.</text><rect x="715" y="452" width="620" height="340" rx="22" fill="#dfe6e4" stroke="none"/><rect x="715" y="445" width="620" height="340" rx="22" fill="#ffffff" stroke="none"/><rect x="739" y="467" width="48" height="36" rx="12" fill="#ae7534" stroke="none"/><text x="763" y="492" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">02</text><text x="805" y="493" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ae7534" text-anchor="start">TURN LONGITUDE INTO TIME</text><text x="745" y="553" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#7b562c" text-anchor="start">360° ÷ 24 h = 15°/h</text><text x="745" y="598" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#173d4b" text-anchor="start">30°E, 14:00  →  78°E, ?</text><text x="745" y="642" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#173d4b" text-anchor="start">48° × 4 min = 192 min</text><rect x="745" y="665" width="270" height="44" rx="13" fill="#f6edda" stroke="none"/><text x="880.0" y="694" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#7b562c" text-anchor="middle">3 h 12 min</text><rect x="1041" y="665" width="264" height="44" rx="13" fill="#e1efec" stroke="none"/><text x="1173.0" y="694" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1c645c" text-anchor="middle">Answer: 17:12</text><text x="745" y="755" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#9b5f35" text-anchor="start">Local mean time ≠ official clock time</text><rect x="65" y="822" width="620" height="340" rx="22" fill="#dfe6e4" stroke="none"/><rect x="65" y="815" width="620" height="340" rx="22" fill="#ffffff" stroke="none"/><rect x="89" y="837" width="48" height="36" rx="12" fill="#4773a2" stroke="none"/><text x="113" y="862" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">03</text><text x="155" y="863" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#4773a2" text-anchor="start">NAME THE TILT REFERENCE</text><line x1="120" y1="1070" x2="395" y2="1070" stroke="#9faeac" stroke-width="3"/><line x1="220" y1="1085" x2="220" y2="905" stroke="#91a5ae" stroke-width="2" stroke-dasharray="6 5"/><line x1="212.044229852041" y1="1088.3495428104584" x2="283.64616118367195" y2="923.203657516333" stroke="#327aa2" stroke-width="5"/><text x="220" y="897" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#49748d" text-anchor="middle">Normal</text><text x="305" y="1091" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#173d4b" text-anchor="start">Plane</text><text x="420" y="945" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#327aa2" text-anchor="start">23.44°</text><text x="420" y="978" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#173d4b" text-anchor="start">from the normal</text><text x="420" y="1033" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#6b8393" text-anchor="start">66.56°</text><text x="420" y="1064" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#173d4b" text-anchor="start">from the plane</text><rect x="91" y="1101" width="568" height="44" rx="13" fill="#e8eef5" stroke="none"/><text x="375.0" y="1130" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#3f6489" text-anchor="middle">The two reference angles add to 90°.</text><rect x="715" y="822" width="620" height="340" rx="22" fill="#dfe6e4" stroke="none"/><rect x="715" y="815" width="620" height="340" rx="22" fill="#ffffff" stroke="none"/><rect x="739" y="837" width="48" height="36" rx="12" fill="#3c8d7c" stroke="none"/><text x="763" y="862" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">04</text><text x="805" y="863" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#3c8d7c" text-anchor="start">WHY SEASONS CHANGE</text><text x="1025" y="915" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#267060" text-anchor="middle">Tilt + Revolution</text><text x="870" y="949" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#597c74" text-anchor="middle">JUNE</text><circle cx="870" cy="1012" r="57" fill="#687f91"/><path d="M870,955 A57,57 0 0 1 870,1069 Z" fill="#f2d18a"/><line x1="839" y1="1083" x2="901" y2="941" stroke="#245f51" stroke-width="4"/><text x="870" y="1119" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1c645c" text-anchor="middle">North: summer</text><text x="1180" y="949" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#597c74" text-anchor="middle">DECEMBER</text><circle cx="1180" cy="1012" r="57" fill="#687f91"/><path d="M1180,955 A57,57 0 0 0 1180,1069 Z" fill="#f2d18a"/><line x1="1149" y1="1083" x2="1211" y2="941" stroke="#245f51" stroke-width="4"/><text x="1180" y="1119" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1c645c" text-anchor="middle">North: winter</text><line x1="1006" y1="999" x2="940" y2="999" stroke="#c09442" stroke-width="3"/><path d="M940,999 l-11,-6 l0,12 z" fill="#c09442" transform="rotate(180.0 940 999)"/><line x1="1044" y1="999" x2="1110" y2="999" stroke="#c09442" stroke-width="3"/><path d="M1110,999 l-11,-6 l0,12 z" fill="#c09442" transform="rotate(0.0 1110 999)"/><text x="1025" y="1051" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ae8338" text-anchor="middle">LIGHT</text><text x="1025" y="1142" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#3b776c" text-anchor="middle">More direct rays + longer daylight</text><rect x="65" y="1192" width="620" height="340" rx="22" fill="#dfe6e4" stroke="none"/><rect x="65" y="1185" width="620" height="340" rx="22" fill="#ffffff" stroke="none"/><rect x="89" y="1207" width="48" height="36" rx="12" fill="#a26b53" stroke="none"/><text x="113" y="1232" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">05</text><text x="155" y="1233" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#a26b53" text-anchor="start">CROSS THE DATE LINE</text><rect x="90" y="1270" width="265" height="120" rx="14" fill="#eaf3eb" stroke="none"/><rect x="395" y="1270" width="265" height="120" rx="14" fill="#f6eee1" stroke="none"/><text x="222" y="1304" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#31715c" text-anchor="middle">WEST: UTC +12</text><text x="222" y="1349" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#173d4b" text-anchor="middle">Tuesday 08:00</text><text x="527" y="1304" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#94683d" text-anchor="middle">EAST: UTC −12</text><text x="527" y="1349" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#173d4b" text-anchor="middle">Monday 08:00</text><line x1="375" y1="1265" x2="375" y2="1403" stroke="#bc8562" stroke-width="3" stroke-dasharray="8 7"/><line x1="135" y1="1432" x2="615" y2="1432" stroke="#9d7154" stroke-width="3"/><path d="M615,1432 l-11,-6 l0,12 z" fill="#9d7154" transform="rotate(0.0 615 1432)"/><text x="375" y="1421" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#8e6349" text-anchor="middle">Eastward: subtract one date</text><line x1="615" y1="1483" x2="135" y2="1483" stroke="#497d6a" stroke-width="3"/><path d="M135,1483 l-11,-6 l0,12 z" fill="#497d6a" transform="rotate(180.0 135 1483)"/><text x="375" y="1472" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#497d6a" text-anchor="middle">Westward: add one date</text><text x="375" y="1511" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#7d817c" text-anchor="middle">Ideal ±12-hour example; actual line bends.</text><rect x="715" y="1192" width="620" height="340" rx="22" fill="#dfe6e4" stroke="none"/><rect x="715" y="1185" width="620" height="340" rx="22" fill="#ffffff" stroke="none"/><rect x="739" y="1207" width="48" height="36" rx="12" fill="#b17b37" stroke="none"/><text x="763" y="1232" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">06</text><text x="805" y="1233" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#b17b37" text-anchor="start">NOON DOES NOT ALWAYS MEAN 90°</text><line x1="760" y1="1440" x2="985" y2="1440" stroke="#8a9f95" stroke-width="3"/><line x1="810" y1="1440" x2="810" y2="1273" stroke="#8a9f95" stroke-width="2" stroke-dasharray="6 5"/><line x1="810" y1="1440" x2="866.4333236487354" y2="1284.9507175703252" stroke="#c49343" stroke-width="3"/><path d="M866.4333236487354,1284.9507175703252 l-11,-6 l0,12 z" fill="#c49343" transform="rotate(-69.99999999999999 866.4333236487354 1284.9507175703252)"/><text x="810" y="1265" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#7b8c82" text-anchor="middle">Zenith</text><text x="889" y="1409" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#b17b37" text-anchor="start">70°</text><text x="1040" y="1307" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#173d4b" text-anchor="start">At 20°N</text><text x="1040" y="1349" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#173d4b" text-anchor="start">Equinox: δ = 0°</text><text x="1040" y="1396" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#173d4b" text-anchor="start">90° − |20° − 0°|</text><text x="1040" y="1438" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#b17b37" text-anchor="start">= 70° altitude</text><rect x="741" y="1471" width="568" height="44" rx="13" fill="#fbf0df" stroke="none"/><text x="1025.0" y="1500" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#986832" text-anchor="middle">Overhead Sun requires latitude = declination.</text><rect x="65" y="1560" width="1270" height="175" rx="22" fill="#173d4b" stroke="none"/><text x="90" y="1596" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9fd9cb" text-anchor="start">FOUR ANNUAL EVENTS</text><text x="92" y="1647" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start">MARCH EQUINOX</text><text x="92" y="1690" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#c6e2d8" text-anchor="start">N spring  /  S autumn</text><text x="405" y="1647" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start">JUNE SOLSTICE</text><text x="405" y="1690" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#c6e2d8" text-anchor="start">N summer  /  S winter</text><text x="718" y="1647" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start">SEPT. EQUINOX</text><text x="718" y="1690" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#c6e2d8" text-anchor="start">N autumn  /  S spring</text><text x="1031" y="1647" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start">DEC. SOLSTICE</text><text x="1031" y="1690" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#c6e2d8" text-anchor="start">N winter  /  S summer</text><text x="70" y="1784" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#316e63" text-anchor="start">LEAP YEAR CHECK</text><text x="290" y="1784" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#173d4b" text-anchor="start">Divisible by 400 → leap; else 100 → common; else 4 → leap; otherwise → common</text><text x="70" y="1823" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#5b756d" text-anchor="start">Original schematics • Rounded values • Event dates vary • N/S denote hemispheres</text><text x="70" y="1854" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#73867d" text-anchor="start">Checked against USNO, CSIR-NPL, NASA and NOAA. Use the chapter for definitions and scope.</text></svg>