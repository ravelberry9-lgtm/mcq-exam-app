<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Gregorian leap-year decision order</title><desc id="desc">మొదట 400తో, తరువాత 100తో, చివర 4తో భాగిస్తుందా చూడాలి. 2000 లీప్; 1900, 2100 లీప్ కావు. లీప్ సంవత్సరంలో ఫిబ్రవరి 29 రోజులు.</desc><rect width="1000" height="500" rx="18" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173e35" text-anchor="start">Gregorian leap-year decision order</text><rect x="70" y="105" width="860" height="75" rx="12" fill="#edf5ef" stroke="#b7d0bf"/><text x="500" y="153" font-size="26" fill="#173e35" text-anchor="middle">Divisible by 400?  YES → LEAP YEAR</text><line x1="500" y1="182" x2="500" y2="215" stroke="#326852" stroke-width="3"/><path d="M500,215 l-12,-6 l0,12 z" fill="#326852" transform="rotate(90.0 500 215)"/><text x="540" y="210" font-size="18" fill="#173e35" text-anchor="start">NO</text><rect x="70" y="225" width="860" height="75" rx="12" fill="#f5eee4" stroke="#b7d0bf"/><text x="500" y="272" font-size="25" fill="#173e35" text-anchor="middle">Otherwise divisible by 100?  YES → COMMON YEAR</text><line x1="500" y1="302" x2="500" y2="335" stroke="#326852" stroke-width="3"/><path d="M500,335 l-12,-6 l0,12 z" fill="#326852" transform="rotate(90.0 500 335)"/><text x="540" y="330" font-size="18" fill="#173e35" text-anchor="start">NO</text><rect x="70" y="345" width="860" height="75" rx="12" fill="#edf5ef" stroke="#b7d0bf"/><text x="500" y="393" font-size="24" fill="#173e35" text-anchor="middle">Otherwise divisible by 4?  YES → LEAP; NO → COMMON</text><text x="60" y="477" font-size="24" fill="#173e35" text-anchor="start">2000: leap   •   1900 / 2100: common   •   2024: leap</text></g></svg>