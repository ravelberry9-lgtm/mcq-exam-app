<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc"><title id="title">Latitude angle in a spherical teaching model</title><desc id="desc">గోళ నమూనాలో O భూమి మధ్యబిందువు. OP రేఖ Equator సమతలంతో ఉత్తరంగా 40° చేస్తే 40°N Latitude. 40 km అని కాదు. ఖచ్చిత Ellipsoid పటాల్లో Geodetic latitude నిర్వచనం వేరని నోట్స్‌లో వివరించాం.</desc><rect width="1100" height="600" fill="#f6f8f3"/><text x="35" y="48" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#173e4b" text-anchor="start">Latitude: where is the angle?</text><rect x="555" y="105" width="505" height="420" rx="18" fill="#edf5ef"/><circle cx="270" cy="320" r="180" fill="#dcecf3" stroke="#7ba8b7" stroke-width="2"/><line x1="60" y1="320" x2="475" y2="320" stroke="#b47c32" stroke-width="4"/><line x1="270" y1="115" x2="270" y2="525" stroke="#7d959c" stroke-width="2" stroke-dasharray="6 6"/><text x="270" y="100" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#173e4b" text-anchor="middle">North Pole: 90°N</text><text x="270" y="557" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#173e4b" text-anchor="middle">South Pole: 90°S</text><text x="73" y="356" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#9a682d" text-anchor="start">Equatorial plane: 0°</text><line x1="270" y1="320" x2="407.88799976141604" y2="204.29823025642293" stroke="#297c6a" stroke-width="5"/><circle cx="407.88799976141604" cy="204.29823025642293" r="7" fill="#297c6a"/><text x="419.88799976141604" y="192.29823025642293" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#297c6a" text-anchor="start">P</text><circle cx="270" cy="320" r="5" fill="#173e4b"/><text x="247" y="304" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173e4b" text-anchor="start">O</text><path d="M350,320 A80,80 0 0 0 331.28355544951825,268.5769912250769" fill="none" stroke="#b47c32" stroke-width="3"/><text x="359" y="299" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#a46d29" text-anchor="start">40°</text><text x="580" y="150" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#173e4b" text-anchor="start">1  Start from the equatorial plane.</text><text x="580" y="205" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#173e4b" text-anchor="start">2  P lies north of that plane.</text><text x="580" y="260" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#173e4b" text-anchor="start">3  OP makes an angle of 40°.</text><text x="580" y="330" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#297c6a" text-anchor="start">P has latitude 40°N</text><text x="580" y="392" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#173e4b" text-anchor="start">An ANGLE, not 40 km.</text><text x="580" y="450" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#173e4b" text-anchor="start">At the Equator: 0°</text><text x="580" y="490" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#173e4b" text-anchor="start">At either pole: 90°</text><text x="35" y="591" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#687d78" text-anchor="start">Teaching sphere: geocentric angle. Surveyed ellipsoids use geodetic latitude (local normal).</text></svg>