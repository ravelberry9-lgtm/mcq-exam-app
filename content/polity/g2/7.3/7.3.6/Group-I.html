<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7.3.6 Group I</title><style>body{font:16px/1.65 system-ui,"Noto Sans Telugu",sans-serif;max-width:70rem;margin:auto;padding:1rem;color:#23191d}h1,h2{color:#861944}.card{border:1px solid #d9c8cf;border-radius:.6rem;padding:1rem;margin:1rem 0}.te{background:#fff8fb;padding:.8rem}li{margin:.65rem 0}</style></head><body><p><a href="./index.html">← Chapter index</a></p><h1>Group I descriptive practice</h1><main id="items"></main><script>fetch("./Group-I.json").then(r=>r.json()).then(d=>{const m=document.getElementById("items");for(const x of d.items||[]){const s=document.createElement("section");s.className="card";s.innerHTML="<h2>"+x.question_en+"</h2><p class=te><strong>తెలుగు:</strong> "+x.question_te+"</p><h3>Model answer — English</h3><ol>"+x.answer_en.map(p=>"<li>"+p+"</li>").join("")+"</ol><h3>నమూనా సమాధానం — తెలుగు</h3><ol class=te>"+x.answer_te.map(p=>"<li>"+p+"</li>").join("")+"</ol><p><small>"+x.model_answer_status+"</small></p>";m.appendChild(s)}})</script></body></html>
