<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7.3.4 publisher review</title><style>body{font:16px/1.55 system-ui,"Noto Sans Telugu",sans-serif;max-width:80rem;margin:auto;padding:1rem}.q{border:1px solid #ccc;padding:1rem;margin:1rem 0}.hold{background:#fff4df}.ok{background:#f1fff4}.te{color:#762144}</style></head><body><p><a href="./index.html">← Chapter index</a></p><h1>Publisher exercises — review route</h1><p>Publisher exercises are not official PYQs. Printed keys and independently validated study answers remain separate. Green items are live practice; amber items remain unscored or use a canonical replacement.</p><main id="m"></main><script>fetch("./Publisher-Questions.json").then(r=>r.json()).then(d=>{for(const q of d.items){const s=document.createElement("section");s.className="q "+(q.scored?"ok":"hold");s.innerHTML="<h2>"+q.source_question_number+". "+q.question_te+"</h2><p>"+q.question_en+"</p><ol>"+q.options_te.map((x,i)=>"<li>"+x+"<br>"+q.options_en[i]+"</li>").join("")+"</ol><p><b>Printed key:</b> "+q.printed_key+" · <b>Study answer:</b> "+(q.study_answer??"held")+" · <b>Status:</b> "+(q.scored?"approved practice":"held/reference")+"</p><p>"+q.review_reason+"</p>"+(q.hold_reason?"<p><b>Hold:</b> "+q.hold_reason+"</p>":"");m.appendChild(s)}})</script></body></html>
