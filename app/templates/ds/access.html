{% extends 'ds/base.html' %}
{% block title %}Enter access code{% endblock %}
{% block head_extra %}<style>
.acg{max-width:22rem;margin:12vh auto 0;padding:0 16px;text-align:center}.acg h1{font-size:1.3rem}.acg p{color:#475569;line-height:1.6}
.acg input{font:700 2rem ui-monospace,monospace;letter-spacing:.4em;text-align:center;width:100%;box-sizing:border-box;padding:14px;border:2px solid #cbd5e1;border-radius:14px;margin:14px 0}
.acg button{width:100%;min-height:50px;font-weight:700}.acg .err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;padding:10px}
</style>{% endblock %}
{% block content %}<div class="acg">
<h1>🔒 Enter access code</h1>
<p>Type the 6-digit code to open the app. You only need to do this once on this device.</p>
{% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ nxt }}">
<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus aria-label="6-digit code">
<button class="btn primary">Open app</button></form>
</div>{% endblock %}
