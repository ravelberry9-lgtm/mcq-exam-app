<!doctype html>
<html lang="{{ lang_code or 'te' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{{ accent_color }}">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}{{ app_title_te }} · {{ app_title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body data-lang="{{ lang_pref or 'both' }}">
  <header class="app-header">
    <button class="hamburger" aria-label="Open menu" id="open-menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <a href="/learn/" class="brand">{{ app_title }}</a>
  </header>

  {% include "_partials/drawer.html" %}

  {% block learn_back %}
  <nav class="learn-back-bar" aria-label="Back to Learn">
    <a class="learn-back" href="/learn/" data-testid="back-to-learn"><span aria-hidden="true">‹</span> Back to Learn · నేర్చుకోండి</a>
  </nav>
  {% endblock %}

  <main class="app-main">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
